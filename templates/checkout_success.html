<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bill – REtail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="page-checkout">
    <div id="bg3d" class="bg-3d" aria-hidden="true"></div>

    <main class="checkout-success">
        <div class="success-icon" aria-hidden="true">✓</div>
        <h1>Thank You!</h1>
        <p>Your payment was successful. Thanks for shopping with REtail.</p>
        <div class="checkout-actions">
            <a href="{{ url_for('customer') }}" class="btn btn-primary">Shop Again</a>
        </div>
    </main>

    <script type="importmap">
    { "imports": { "three": "https://esm.sh/three" } }
    </script>
    <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('bg3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xffffff);
    const aspect = window.innerWidth / window.innerHeight;
    const frustumSize = 24;
    const camera = new THREE.OrthographicCamera(
        -frustumSize * aspect, frustumSize * aspect,
        frustumSize, -frustumSize, 0.1, 1000
    );
    camera.position.z = 12;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0xffffff, 1);
    container.appendChild(renderer.domElement);

    const geometry = new THREE.TorusGeometry(1, 0.3, 16, 48);
    const material = new THREE.MeshPhongMaterial({
        color: 0x06b6d4,
        emissive: 0x06b6d4,
        emissiveIntensity: 0.2,
        transparent: true,
        opacity: 0.45,
        wireframe: true
    });
    const meshes = [];
    const spreadX = frustumSize * aspect * 0.95;
    const spreadY = frustumSize * 0.95;
    for (let i = 0; i < 10; i++) {
        const mesh = new THREE.Mesh(geometry, material.clone());
        mesh.position.set(
            (Math.random() - 0.5) * spreadX * 2,
            (Math.random() - 0.5) * spreadY * 2,
            (Math.random() - 0.5) * 16 - 4
        );
        mesh.rotation.x = Math.random() * Math.PI;
        mesh.scale.setScalar(1.5 + Math.random() * 2);
        mesh.userData = { speed: 0.1 + Math.random() * 0.2 };
        scene.add(mesh);
        meshes.push(mesh);
    }
    const light = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(light);
    const pointLight = new THREE.PointLight(0x06b6d4, 0.65, 80);
    pointLight.position.set(8, 8, 8);
    scene.add(pointLight);

    function animate() {
        requestAnimationFrame(animate);
        meshes.forEach((m, i) => {
            m.rotation.x += m.userData.speed * 0.008;
            m.rotation.y += m.userData.speed * 0.012;
        });
        renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
        const a = window.innerWidth / window.innerHeight;
        camera.left = -frustumSize * a;
        camera.right = frustumSize * a;
        camera.top = frustumSize;
        camera.bottom = -frustumSize;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    </script>
</body>
</html>
