<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping – QuickBill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="page-customer">
    <header class="header compact">
        <a href="{{ url_for('index') }}" class="logo-wrap">
            <img src="{{ url_for('static', filename='logo03.png') }}" alt="QuickBill" class="logo">
        </a>
        <nav class="nav">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('form') }}">Sign Up</a>
        </nav>
    </header>

    <main class="customer-main">
        <aside class="cart-panel">
            <h2>Your Cart</h2>
            <ul class="cart-list" id="itemList" aria-live="polite">
                <li class="cart-empty" id="cartEmpty">No items yet. Scan or add products.</li>
            </ul>
            <div class="cart-total" id="cartTotal" aria-hidden="true"></div>
        </aside>

        <section class="scan-section">
            <h2>Scan Your Items</h2>
            <p class="scan-desc">Place your barcode in front of the camera to scan, or add items manually.</p>

            <div class="manual-add" id="manualAdd">
                <label for="barcodeInput">Add by Barcode / Product ID</label>
                <div class="add-row">
                    <input type="text" id="barcodeInput" placeholder="Enter barcode or product ID" autocomplete="off">
                    <input type="number" id="qtyInput" min="1" value="1" aria-label="Quantity">
                    <button type="button" class="btn btn-secondary" id="addItemBtn">Add</button>
                </div>
                <p class="hint" id="addHint"></p>
            </div>

            <div class="scanner-placeholder" id="scanner">
                <span>Camera integration ready</span>
                <small>Backend can connect barcode scanner here</small>
            </div>

            <div class="customer-actions">
                <button type="button" class="btn btn-secondary" id="refreshBtn">Refresh Cart</button>
                <button type="button" class="btn btn-primary" id="checkoutBtn">Checkout</button>
            </div>
        </section>
    </main>

    <script>
        const itemList = document.getElementById('itemList');
        const cartEmpty = document.getElementById('cartEmpty');
        const cartTotal = document.getElementById('cartTotal');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const addItemBtn = document.getElementById('addItemBtn');
        const barcodeInput = document.getElementById('barcodeInput');
        const qtyInput = document.getElementById('qtyInput');
        const addHint = document.getElementById('addHint');

        function renderCart(items) {
            if (!items || items.length === 0) {
                cartEmpty.style.display = 'block';
                cartTotal.textContent = '';
                itemList.innerHTML = '';
                itemList.appendChild(cartEmpty);
                return;
            }
            cartEmpty.style.display = 'none';
            let total = 0;
            const lis = items.map(item => {
                const price = Number(item.Price) || 0;
                const qty = Number(item.quantity) || 1;
                total += price * qty;
                return `<li class="cart-item"><span class="cart-item-name">${escapeHtml(item["Item Name"])}</span> <span class="cart-item-price">$${price.toFixed(2)} × ${qty}</span></li>`;
            });
            itemList.innerHTML = lis.join('');
            cartTotal.textContent = `Total: $${total.toFixed(2)}`;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function loadItems() {
            fetch('{{ url_for("get_items") }}')
                .then(r => r.json())
                .then(items => renderCart(items))
                .catch(() => renderCart([]));
        }

        checkoutBtn.addEventListener('click', function() {
            fetch('{{ url_for("checkout") }}', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success !== false) {
                        window.location.href = '{{ url_for("checkout_form") }}';
                    } else {
                        alert(data.message || 'Checkout failed.');
                    }
                })
                .catch(() => alert('Checkout request failed.'));
        });

        refreshBtn.addEventListener('click', loadItems);

        addItemBtn.addEventListener('click', function() {
            const barcode = (barcodeInput.value || '').trim();
            const qty = Math.max(1, parseInt(qtyInput.value, 10) || 1);
            if (!barcode) {
                addHint.textContent = 'Enter a barcode or product ID.';
                return;
            }
            addHint.textContent = '';
            fetch('{{ url_for("add_item") }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: barcode, quantity: qty })
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) {
                    addHint.textContent = data.error;
                } else {
                    addHint.textContent = 'Added: ' + (data["Item Name"] || data.product_name) + '.';
                    barcodeInput.value = '';
                    loadItems();
                }
            })
            .catch(() => {
                addHint.textContent = 'Add failed. Check backend.';
            });
        });

        loadItems();
    </script>
</body>
</html>
