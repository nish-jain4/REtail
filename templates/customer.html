<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping - QuickBill</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="page-customer">
    <header class="header compact">
        <a href="{{ url_for('index') }}" class="logo-wrap">
            <img src="{{ url_for('static', filename='logo03.png') }}" alt="QuickBill" class="logo">
        </a>
        <nav class="nav">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('form') }}">Sign Up</a>
        </nav>
    </header>

    <main class="customer-main">
        <aside class="cart-panel">
            <h2>Your Cart</h2>
            <ul class="cart-list" id="itemList" aria-live="polite">
                <li class="cart-empty" id="cartEmpty">No items yet. Scan or add products.</li>
            </ul>
            <div class="cart-total" id="cartTotal"></div>
        </aside>

        <section class="scan-section">
            <h2>Scan Your Items</h2>
            <p class="scan-desc">Use barcode/product id for now. Camera scanner can be connected here.</p>

            <div class="manual-add">
                <label for="barcodeInput">Add by Barcode / Product ID</label>
                <div class="add-row">
                    <input type="text" id="barcodeInput" placeholder="Enter barcode or product ID" autocomplete="off">
                    <input type="number" id="qtyInput" min="1" value="1" aria-label="Quantity">
                    <button type="button" class="btn btn-secondary" id="addItemBtn">Add</button>
                </div>
                <p class="hint" id="addHint"></p>
            </div>

            <div class="scanner-placeholder" id="scanner">
                <span>Scanner Placeholder</span>
                <small>Backend API is ready for barcode feed integration.</small>
            </div>

            <div class="customer-actions">
                <button type="button" class="btn btn-secondary" id="refreshBtn">Refresh Cart</button>
                <button type="button" class="btn btn-primary" id="checkoutBtn">Pay Now</button>
            </div>
        </section>
    </main>

    <script>
        // UI state references.
        const itemList = document.getElementById("itemList");
        const cartEmpty = document.getElementById("cartEmpty");
        const cartTotal = document.getElementById("cartTotal");
        const addHint = document.getElementById("addHint");
        const barcodeInput = document.getElementById("barcodeInput");
        const qtyInput = document.getElementById("qtyInput");
        const addItemBtn = document.getElementById("addItemBtn");
        const refreshBtn = document.getElementById("refreshBtn");
        const checkoutBtn = document.getElementById("checkoutBtn");

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value || "";
            return div.innerHTML;
        }

        function formatCurrency(amount, currency) {
            return new Intl.NumberFormat("en-IN", {
                style: "currency",
                currency: currency || "INR"
            }).format(Number(amount || 0));
        }

        function renderCart(items, totalAmount, currency) {
            itemList.innerHTML = "";
            if (!items || items.length === 0) {
                cartEmpty.style.display = "block";
                itemList.appendChild(cartEmpty);
                cartTotal.textContent = "Total: " + formatCurrency(0, currency);
                return;
            }

            cartEmpty.style.display = "none";
            items.forEach((item) => {
                const line = Number(item["Line Total"] || 0);
                const quantity = Number(item["Quantity"] || 1);
                const li = document.createElement("li");
                li.className = "cart-item";
                li.innerHTML = `<span class="cart-item-name">${escapeHtml(item["Item Name"])}</span><span class="cart-item-price">${formatCurrency(line, currency)} x ${quantity}</span>`;
                itemList.appendChild(li);
            });
            cartTotal.textContent = "Total: " + formatCurrency(totalAmount, currency);
        }

        async function loadItems() {
            // Pull latest cart snapshot from backend and render totals.
            try {
                const response = await fetch("{{ url_for('get_items') }}");
                const data = await response.json();
                renderCart(data.items || [], data.total_amount || 0, data.currency || "INR");
            } catch (error) {
                renderCart([], 0, "INR");
            }
        }

        async function addItem() {
            // Adds one product line into backend cart storage.
            const productId = (barcodeInput.value || "").trim();
            const quantity = Math.max(1, parseInt(qtyInput.value, 10) || 1);

            if (!productId) {
                addHint.textContent = "Enter a barcode or product ID.";
                return;
            }

            addHint.textContent = "";
            try {
                const response = await fetch("{{ url_for('add_item') }}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ product_id: productId, quantity: quantity })
                });
                const data = await response.json();
                if (!response.ok) {
                    addHint.textContent = data.error || "Unable to add product.";
                    return;
                }

                addHint.textContent = "Added: " + (data["Item Name"] || productId);
                barcodeInput.value = "";
                qtyInput.value = "1";
                await loadItems();
            } catch (error) {
                addHint.textContent = "Unable to add product right now.";
            }
        }

        async function verifyPayment(payload) {
            // Server verifies Razorpay signature before final success redirect.
            const response = await fetch("{{ url_for('verify_payment') }}", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.message || "Payment verification failed.");
            }
            window.location.href = data.redirect_url || "{{ url_for('checkout_success') }}";
        }

        async function startCheckout() {
            // Create order on server, then open Razorpay checkout widget.
            try {
                const response = await fetch("{{ url_for('checkout') }}", { method: "POST" });
                const data = await response.json();
                if (!response.ok) {
                    alert(data.message || "Checkout failed.");
                    return;
                }

                const options = {
                    key: data.key_id,
                    amount: data.amount,
                    currency: data.currency,
                    name: data.name,
                    description: data.description,
                    order_id: data.order_id,
                    prefill: data.prefill || {},
                    handler: async function (paymentPayload) {
                        try {
                            await verifyPayment(paymentPayload);
                        } catch (error) {
                            alert(error.message);
                        }
                    },
                    theme: { color: "#e94f37" }
                };

                const razorpay = new Razorpay(options);
                razorpay.on("payment.failed", function (errorPayload) {
                    const msg = errorPayload && errorPayload.error && errorPayload.error.description
                        ? errorPayload.error.description
                        : "Payment failed. Try again.";
                    alert(msg);
                });
                razorpay.open();
            } catch (error) {
                alert("Checkout request failed.");
            }
        }

        addItemBtn.addEventListener("click", addItem);
        refreshBtn.addEventListener("click", loadItems);
        checkoutBtn.addEventListener("click", startCheckout);

        loadItems();
    </script>
</body>
</html>
